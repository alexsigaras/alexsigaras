name: Update research metrics

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google Scholar and website metrics
        run: python3 .github/scripts/update_metrics.py

      - name: Commit metrics
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/metrics.json
          git diff --cached --quiet && exit 0
          git commit -m "Update research metrics"
          git pull --rebase
          git push
